name: fork-release

on:
  push:
    tags:
      - "v*-strip.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release linux/amd64
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: "1"
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build
        run: |
          mkdir -p build build_assets/x-ui
          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o build/x-ui \
            .
          file build/x-ui

      - name: Package
        run: |
          cp build/x-ui build_assets/x-ui/x-ui
          cp README.md LICENSE build_assets/x-ui/
          cp x-ui.sh x-ui.service.debian x-ui.service.arch x-ui.service.rhel build_assets/x-ui/

          tar -czf x-ui-linux-amd64.tar.gz -C build_assets x-ui
          {
            echo "# Hash Values"
            echo
            echo "MD5= $(md5sum x-ui-linux-amd64.tar.gz | awk '{print $1}')"
            echo "SHA1= $(sha1sum x-ui-linux-amd64.tar.gz | awk '{print $1}')"
            echo "SHA2-256= $(sha256sum x-ui-linux-amd64.tar.gz | awk '{print $1}')"
            echo "SHA2-512= $(sha512sum x-ui-linux-amd64.tar.gz | awk '{print $1}')"
          } > x-ui-linux-amd64.tar.gz.dgst

          cp build/x-ui x-ui-linux-amd64
          sha256sum x-ui-linux-amd64 > x-ui-linux-amd64.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-amd64-release
          path: |
            x-ui-linux-amd64.tar.gz
            x-ui-linux-amd64.tar.gz.dgst
            x-ui-linux-amd64
            x-ui-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              x-ui-linux-amd64.tar.gz \
              x-ui-linux-amd64.tar.gz.dgst \
              x-ui-linux-amd64 \
              x-ui-linux-amd64.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              x-ui-linux-amd64.tar.gz \
              x-ui-linux-amd64.tar.gz.dgst \
              x-ui-linux-amd64 \
              x-ui-linux-amd64.sha256 \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
